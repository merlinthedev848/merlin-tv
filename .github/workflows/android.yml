name: Android build and release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: merlin-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_B64: ${{ secrets.MERLIN_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/merlin-release.jks"

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          MERLIN_KEYSTORE_PATH: ${{ runner.temp }}/merlin-release.jks
          MERLIN_KEYSTORE_PASSWORD: ${{ secrets.MERLIN_KEYSTORE_PASSWORD }}
          MERLIN_KEY_ALIAS: ${{ secrets.MERLIN_KEY_ALIAS }}
          MERLIN_KEY_PASSWORD: ${{ secrets.MERLIN_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Rename release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: cp app/build/outputs/apk/release/app-release.apk "merlin-tv-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: merlin-tv-${{ github.ref_name }}.apk
