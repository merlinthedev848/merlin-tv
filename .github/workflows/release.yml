name: Merlin TV CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: merlin-tv-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Release Signed APK
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore (if configured)
        if: env.MERLIN_KEYSTORE_BASE64 != ''
        env:
          MERLIN_KEYSTORE_BASE64: ${{ secrets.MERLIN_KEYSTORE_BASE64 }}
        run: |
          echo "$MERLIN_KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "MERLIN_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          MERLIN_KEYSTORE_PASSWORD: ${{ secrets.MERLIN_KEYSTORE_PASSWORD }}
          MERLIN_KEY_ALIAS: ${{ secrets.MERLIN_KEY_ALIAS }}
          MERLIN_KEY_PASSWORD: ${{ secrets.MERLIN_KEY_PASSWORD }}
        run: |
          if [ -f "release.keystore" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/merlin-tv-${{ github.ref_name }}.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true